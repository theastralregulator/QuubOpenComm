name: opencomm_mobile
description: OpenComm Flutter mobile application built with Riverpod, GoRouter, and Supabase.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  supabase_flutter: ^2.6.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  lucide_icons: ^0.3.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
